<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Rahul Krishnan, MERN Stack Development Student</title>
<desc id="d">Dark red gradient banner with the tagline Learn, Build, Improve.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1115"/><stop offset=".6" stop-color="#1B1114"/><stop offset="1" stop-color="#8E1B2B"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#D62839" stop-opacity=".6"/><stop offset="1" stop-color="#D62839" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="1200" height="340" rx="24"/></clipPath>
</defs>
<style>
.n{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:72px;letter-spacing:4px;fill:#fff}
.r{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:32px;letter-spacing:3px;fill:#FF5A6A}
.t{font-family:Consolas,'SFMono-Regular','Courier New',monospace;font-size:24px;letter-spacing:7px;fill:#C9CED6}
.ch{font-family:Consolas,'SFMono-Regular','Courier New',monospace;font-weight:700;font-size:26px;fill:#fff}
.sw{animation:sw 8s ease-in-out infinite}
.gl{animation:gl 5s ease-in-out infinite alternate}
.fl{animation:fl 5s ease-in-out infinite alternate}
.bd{animation:bd 3s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-400px)}to{transform:translateX(1300px)}}
@keyframes gl{from{opacity:.5}to{opacity:1}}
@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-14px)}}
@keyframes bd{from{stroke-opacity:.2}to{stroke-opacity:.75}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
<rect width="1200" height="340" fill="url(#bg)"/>
<ellipse class="gl" cx="1040" cy="170" rx="360" ry="240" fill="url(#gl)"/>
<rect class="sw" width="300" height="340" fill="url(#sh)"/>
</g>
<rect class="bd" x="40" y="40" width="1120" height="260" rx="24" fill="#fff" fill-opacity=".04" stroke="#FF5A6A" stroke-width="2"/>
<text class="n" x="80" y="140">RAHUL KRISHNAN</text>
<text class="r" x="82" y="198">MERN STACK DEVELOPMENT STUDENT</text>
<text class="t" x="82" y="252">LEARN • BUILD • IMPROVE</text>
<g class="fl"><rect x="900" y="70" width="120" height="56" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".2"/><text class="ch" x="960" y="106" text-anchor="middle">&lt;/&gt;</text></g>
<g class="fl" style="animation-delay:-2s"><rect x="1010" y="150" width="120" height="56" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".2"/><text class="ch" x="1070" y="186" text-anchor="middle">{ }</text></g>
<g class="fl" style="animation-delay:-3.5s"><rect x="910" y="225" width="120" height="56" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".2"/><text class="ch" x="970" y="261" text-anchor="middle">MERN</text></g>
</svg>
