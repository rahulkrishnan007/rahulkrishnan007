<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Rahul Krishnan, MERN Stack Developer</title>
  <desc id="d">Banner with copper circuit traces carrying a signal. Tagline: From circuits to code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2230"/>
      <stop offset="1" stop-color="#14424E"/>
    </linearGradient>
  </defs>
  <style>
    .name{font:700 68px 'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#F2F5F7;letter-spacing:-1px}
    .role{font:500 30px 'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#7FD6C2}
    .tag{font:400 22px Consolas,'Courier New',monospace;fill:#E0A458}
    .trace{fill:none;stroke:#E0A458;stroke-opacity:.35;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .flow{fill:none;stroke:#7FD6C2;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:36 320;animation:flow 4s linear infinite}
    .pad{fill:#0B2230;stroke:#E0A458;stroke-width:3}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes flow{to{stroke-dashoffset:-356}}
    @keyframes blink{50%{fill-opacity:0}}
    @media (prefers-reduced-motion:reduce){.flow,.cur{animation:none}}
  </style>
  <rect width="1200" height="300" fill="url(#bg)"/>

  <g>
    <path id="a" class="trace" d="M640 90H760L800 50H1000L1030 80H1130"/>
    <path id="b" class="trace" d="M700 150H820L860 190H1060L1090 160H1160"/>
    <path id="c" class="trace" d="M600 230H780L820 260H980L1010 230H1100"/>
    <path class="flow" d="M640 90H760L800 50H1000L1030 80H1130"/>
    <path class="flow" style="animation-delay:-1.3s" d="M700 150H820L860 190H1060L1090 160H1160"/>
    <path class="flow" style="animation-delay:-2.6s" d="M600 230H780L820 260H980L1010 230H1100"/>
    <circle class="pad" cx="640" cy="90" r="7"/>
    <circle class="pad" cx="1130" cy="80" r="7"/>
    <circle class="pad" cx="700" cy="150" r="7"/>
    <circle class="pad" cx="1160" cy="160" r="7"/>
    <circle class="pad" cx="600" cy="230" r="7"/>
    <circle class="pad" cx="1100" cy="230" r="7"/>
  </g>

  <text class="name" x="70" y="130">Rahul Krishnan</text>
  <text class="role" x="72" y="185">MERN Stack Developer</text>
  <text class="tag" x="72" y="238">From circuits to code<tspan class="cur">_</tspan></text>
</svg>
